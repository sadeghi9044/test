<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>چیدمان بخش‌ها | سایت‌ساز</title>
<meta name="robots" content="noindex, nofollow">
<link href="vendor/vazirmatn/vazirmatn.css" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%23ec4899'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle' fill='white' font-family='Arial' font-weight='bold'%3ES%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pro.css">
<link rel="stylesheet" href="css/editor.css">
</head>
<body data-page="sections">

<div id="editorRoot"></div>

<template id="pageBody">

<section class="editor-section">
  <h2>🧩 چیدمان بخش‌های سایت</h2>
  <p class="editor-desc">بخش‌ها را با کلید روشن یا خاموش کن و با فلش‌ها جابه‌جا کن. بخش‌های بدون محتوا در سایت منتشرشده نمایش داده نمی‌شوند.</p>
  <div class="sec-list" id="secList"></div>
</section>

</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/editor-core.js"></script>
<script>

Editor.start('sections', {
  title: 'چیدمان بخش‌ها', sub: 'ترتیب و نمایش بخش‌های سایت',
  ready: function (E) {
    var META = E.SECTION_META, LIST = E.SECTION_LIST;
    function count(key) {
      if (key === 'products') return E.isProductTpl() ? (E.editor.products || []).filter(function (p) { return !p.sample; }).length : (E.editor.products || []).length;
      return LIST[key] ? (E.editor[LIST[key]] || []).length : null;
    }
    function render() {
      var secs = E.editor.sections;
      document.getElementById('secList').innerHTML = secs.map(function (s, i) {
        var m = META[s.key], c = count(s.key), label = s.key === 'products' ? E.labels().list : m.label;
        var note = m.fixed ? 'همیشه نمایش داده می‌شود' : s.key === 'booking' ? 'دکمه‌ی تماس برای رزرو' : c === null ? '' : c ? E.fmtMoney(c) + ' مورد' : 'خالی — تا افزودن محتوا منتشر نمی‌شود';
        return '<div class="sec-row' + (s.on ? '' : ' off') + '"><span class="ic">' + m.icon + '</span>' +
          '<div class="tx"><b>' + E.esc(label) + '</b><span>' + E.esc(note) + '</span></div>' +
          '<div class="mv"><button type="button" data-up="' + i + '"' + (i === 0 ? ' disabled' : '') + ' aria-label="بالا">↑</button><button type="button" data-down="' + i + '"' + (i === secs.length - 1 ? ' disabled' : '') + ' aria-label="پایین">↓</button></div>' +
          '<label class="sw"><input type="checkbox" data-on="' + i + '"' + (s.on ? ' checked' : '') + (m.fixed ? ' disabled' : '') + '><i></i></label></div>';
      }).join('');
    }
    function swap(i, j) {
      var a = E.editor.sections;
      if (j < 0 || j >= a.length) return;
      var t = a[i]; a[i] = a[j]; a[j] = t;
      E.touch(); render(); E.renderPreview();
    }
    document.getElementById('secList').addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      if (b.dataset.up !== undefined) swap(+b.dataset.up, +b.dataset.up - 1);
      if (b.dataset.down !== undefined) swap(+b.dataset.down, +b.dataset.down + 1);
    });
    document.getElementById('secList').addEventListener('change', function (ev) {
      var i = ev.target.dataset.on; if (i === undefined) return;
      E.editor.sections[+i].on = ev.target.checked;
      E.touch(); render(); E.renderPreview();
    });
    render();
  }
});

</script>
</body>
</html>
